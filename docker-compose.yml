services:
  postgres:
    image: postgres:16-alpine
    container_name: ffgif-postgres
    environment:
      - POSTGRES_USER=${PG_SUPERUSER}
      - POSTGRES_DB=${PG_SUPERDB}
      - POSTGRES_HOST_AUTH_METHOD=trust
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_SUPERUSER} -d ${PG_SUPERDB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ffgif-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ffgif-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RMQ_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - backend
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: ffgif-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_NOTIFY_AMQP_ENABLE_1=on
      - MINIO_NOTIFY_AMQP_URL_1=amqp://${RMQ_USER}:${RMQ_PASS}@rabbitmq:5672
      - MINIO_NOTIFY_AMQP_EXCHANGE_1=${MINIO_NOTIFY_EXCHANGE}
      - MINIO_NOTIFY_AMQP_EXCHANGE_TYPE_1=fanout
      - MINIO_NOTIFY_AMQP_ROUTING_KEY_1=
      - MINIO_NOTIFY_AMQP_DURABLE_1=on
      - MINIO_NOTIFY_AMQP_AUTO_DELETED_1=off
      - MINIO_NOTIFY_AMQP_DELIVERY_MODE_1=2
      - MINIO_NOTIFY_AMQP_NO_WAIT_1=off
      - MINIO_NOTIFY_AMQP_MANDATORY_1=off
      - MINIO_NOTIFY_AMQP_INTERNAL_1=off
      - MINIO_PERSIST_BUCKET=${MINIO_PERSIST_BUCKET}
      - MINIO_TEMP_BUCKET=${MINIO_TEMP_BUCKET}
      - MINIO_API_CORS_ALLOW_ORIGIN=${MINIO_API_CORS_ALLOW_ORIGIN}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  bootstrap:
    build: .
    container_name: ffgif-bootstrap
    entrypoint: ["/app/bootstrap"]
    command: ["all"]
    environment:
      - ADDR=0.0.0.0
      - VERSION=${VERSION}
      - PORT=${PORT}
      - SERVICE_NAME=${SERVICE_NAME}
      - BCRYPT_COST=${BCRYPT_COST}
      - HASH_PEPPER=${HASH_PEPPER}
      - JWT_SECRET=${JWT_SECRET}
      - PG_USER=${PG_USER}
      - PG_PASSWORD=${PG_PASSWORD}
      - PG_PORT=${PG_PORT}
      - PG_ADDRESS=postgres
      - PG_NAME=${PG_NAME}
      - PG_SSLMODE=${PG_SSLMODE}
      - PG_SUPERUSER=${PG_SUPERUSER}
      - PG_SUPERDB=${PG_SUPERDB}
      - REDIS_ADDR=redis:6379
      - RMQ_ADDR=rabbitmq:5672
      - RMQ_USER=${RMQ_USER}
      - RMQ_PASS=${RMQ_PASS}
      - MINIO_ADDR=minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_TEMP_BUCKET=${MINIO_TEMP_BUCKET}
      - MINIO_PERSIST_BUCKET=${MINIO_PERSIST_BUCKET}
      - MINIO_NOTIFY_EXCHANGE=${MINIO_NOTIFY_EXCHANGE}
      - MINIO_TEMP_BUCKET_TTL_DAYS=${MINIO_TEMP_BUCKET_TTL_DAYS}
      - MINIO_API_CORS_ALLOW_ORIGIN=${MINIO_API_CORS_ALLOW_ORIGIN}
      - MINIO_PUBLIC_ENDPOINT=127.0.0.1:9000
      - EMAIL=${EMAIL}
      - MAILTRAP_USERNAME=${MAILTRAP_USERNAME}
      - MAILTRAP_PASSWORD=${MAILTRAP_PASSWORD}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - backend
    restart: "no"

  api:
    build: .
    container_name: ffgif-api
    entrypoint: ["/app/ffgif"]
    ports:
      - "8080:8080"
    environment:
      - ADDR=0.0.0.0
      - PORT=${PORT}
      - VERSION=${VERSION}
      - SERVICE_NAME=${SERVICE_NAME}
      - BCRYPT_COST=${BCRYPT_COST}
      - HASH_PEPPER=${HASH_PEPPER}
      - JWT_SECRET=${JWT_SECRET}
      - PG_USER=${PG_USER}
      - PG_PASSWORD=${PG_PASSWORD}
      - PG_PORT=${PG_PORT}
      - PG_ADDRESS=postgres
      - PG_NAME=${PG_NAME}
      - PG_SSLMODE=${PG_SSLMODE}
      - PG_SUPERUSER=${PG_SUPERUSER}
      - PG_SUPERDB=${PG_SUPERDB}
      - REDIS_ADDR=redis:6379
      - RMQ_ADDR=rabbitmq:5672
      - RMQ_USER=${RMQ_USER}
      - RMQ_PASS=${RMQ_PASS}
      - MINIO_ADDR=minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_TEMP_BUCKET=${MINIO_TEMP_BUCKET}
      - MINIO_PERSIST_BUCKET=${MINIO_PERSIST_BUCKET}
      - MINIO_NOTIFY_EXCHANGE=${MINIO_NOTIFY_EXCHANGE}
      - MINIO_TEMP_BUCKET_TTL_DAYS=${MINIO_TEMP_BUCKET_TTL_DAYS}
      - MINIO_API_CORS_ALLOW_ORIGIN=${MINIO_API_CORS_ALLOW_ORIGIN}
      - MINIO_PUBLIC_ENDPOINT=127.0.0.1:9000
      - EMAIL=${EMAIL}
      - MAILTRAP_USERNAME=${MAILTRAP_USERNAME}
      - MAILTRAP_PASSWORD=${MAILTRAP_PASSWORD}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - OTEL_EXPORTER_OTLP_ENDPOINT=jaeger:4317
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
      jaeger:
        condition: service_started
    networks:
      - backend
    volumes:
      - apitmp:/tmp/ffgif
    restart: unless-stopped

  worker:
    build: .
    container_name: ffgif-worker
    entrypoint: [ "/app/worker" ]
    ports:
      - "8081:8081"
    environment:
      - ADDR=0.0.0.0
      - PORT=${PORT}
      - VERSION=${VERSION}
      - SERVICE_NAME=${SERVICE_NAME}
      - BCRYPT_COST=${BCRYPT_COST}
      - HASH_PEPPER=${HASH_PEPPER}
      - JWT_SECRET=${JWT_SECRET}
      - PG_USER=${PG_USER}
      - PG_PASSWORD=${PG_PASSWORD}
      - PG_PORT=${PG_PORT}
      - PG_ADDRESS=postgres
      - PG_NAME=${PG_NAME}
      - PG_SSLMODE=${PG_SSLMODE}
      - PG_SUPERUSER=${PG_SUPERUSER}
      - PG_SUPERDB=${PG_SUPERDB}
      - REDIS_ADDR=redis:6379
      - RMQ_ADDR=rabbitmq:5672
      - RMQ_USER=${RMQ_USER}
      - RMQ_PASS=${RMQ_PASS}
      - MINIO_ADDR=minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_TEMP_BUCKET=${MINIO_TEMP_BUCKET}
      - MINIO_PERSIST_BUCKET=${MINIO_PERSIST_BUCKET}
      - MINIO_NOTIFY_EXCHANGE=${MINIO_NOTIFY_EXCHANGE}
      - MINIO_TEMP_BUCKET_TTL_DAYS=${MINIO_TEMP_BUCKET_TTL_DAYS}
      - MINIO_API_CORS_ALLOW_ORIGIN=${MINIO_API_CORS_ALLOW_ORIGIN}
      - MINIO_PUBLIC_ENDPOINT=127.0.0.1:9000
      - EMAIL=${EMAIL}
      - MAILTRAP_USERNAME=${MAILTRAP_USERNAME}
      - MAILTRAP_PASSWORD=${MAILTRAP_PASSWORD}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - OTEL_EXPORTER_OTLP_ENDPOINT=jaeger:4317
      - WORKER_METRICS_PORT=8081
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
      jaeger:
        condition: service_started
    networks:
      - backend
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: ffgif-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Jaeger Web UI
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    networks:
      - backend
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: ffgif-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    networks:
      - backend
    restart: unless-stopped

  loki:
    image: grafana/loki:3.0.0
    container_name: ffgif-loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - lokidata:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - backend
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.0.0
    container_name: ffgif-promtail
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - backend
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: ffgif-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - jaeger
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
  miniodata:
  apitmp:
  prometheusdata:
  lokidata:
  grafanadata: